# https://www.home-assistant.io/integrations/default_config/
default_config:

# https://www.home-assistant.io/integrations/homeassistant/
homeassistant:
  debug: true

# https://www.home-assistant.io/integrations/logger/
logger:
  default: info
  logs:
    custom_components.tasktracker: debug

automation: !include automations.yaml

# Remote debugging: uncomment this block and the 5678 port mapping in
# compose.yaml, restart, then attach VS Code to localhost:5678.
